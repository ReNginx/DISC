defaults:
  - default
  - model: hylap
  - override data: metaworld
  - _self_

# Experiment settings
stage: test

demo_num: 10
finetune_steps: 100
finetune_method: "policynet"

data:
  eval_config:
    enabled: true
    num_episodes_per_task: 20
    split_txt: "config/data/meta-world_splits/test.txt"

trainer:
  limit_val_batches: 1
  inference_mode: false

model:
  test_time_training_config:
    enabled: true
    max_demos: ${demo_num}
    num_adaptation_steps: ${finetune_steps}
    adaptation_method: ${finetune_method}

experiment_name: "${hydra:runtime.choices.data}_ttt" 
version: "${hydra:runtime.choices.model}/demo_${demo_num}_finetune_steps_${finetune_steps}_method_${finetune_method}"
exp_log_dir: ${log_dir}/${experiment_name}/${version}
checkpoint_dir: ${exp_log_dir}/checkpoints