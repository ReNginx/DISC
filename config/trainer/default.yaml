# Default PyTorch Lightning Trainer Configuration
# @package trainer

_target_: lightning.Trainer

# Basic training settings
max_epochs: ${max_epochs}
accelerator: ${accelerator}
devices: ${devices}
precision: ${precision}
sync_batchnorm: true
# strategy: ddp

# Validation and logging
check_val_every_n_epoch: ${check_val_every_n_epoch}
log_every_n_steps: ${log_every_n_steps}
enable_progress_bar: true
enable_model_summary: true
# num_sanity_val_steps: 0

# Checkpointing
enable_checkpointing: true
default_root_dir: ${checkpoint_dir}

# Early stopping and monitoring
callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${checkpoint_dir}
    filename: "epoch_{epoch:02d}-val_loss_{val/action_loss:.4f}_success_rate_{overall_success_rate:.4f}"
    monitor: "overall_success_rate"
    auto_insert_metric_name: false
    enable_version_counter: false
    save_weights_only: true
    mode: "max"
    save_top_k: -1
    save_last: false

  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${checkpoint_dir}
    filename: "last"
    auto_insert_metric_name: false
    enable_version_counter: false
    save_on_train_epoch_end: true
    save_last: true
    
  # - _target_: lightning.pytorch.callbacks.EarlyStopping
  #   monitor: "val/action_loss"
  #   mode: "min"
  #   patience: 10
  #   min_delta: 0.001
    


# Reproducibility
deterministic: ${deterministic}

# Debugging
fast_dev_run: ${debug}
overfit_batches: 0.0